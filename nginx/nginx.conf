# Reverse proxy перед backend — порт 8000 больше не светится наружу напрямую
# (docker-compose.yml), плюс базовый rate limiting по IP. См. memory:
# project-backend-production-readiness, пункт 3.
#
# TLS сюда намеренно НЕ добавлен — для сертификата (Let's Encrypt и т.п.)
# нужен реальный домен, у проекта его пока нет. Добавить отдельно при
# реальном деплое, не для локальной разработки.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    client_max_body_size 25m;  # чуть больше upload_max_file_size backend'а (20 МБ) — лимит проверяет само приложение, тут просто не обрезать раньше него

    # 127.0.0.11 — встроенный DNS Docker Compose. Без явного resolver +
    # переменной в proxy_pass nginx резолвит "backend" ОДИН РАЗ при старте
    # (через upstream{}) и держит старый IP, даже когда backend-контейнер
    # пересоздаётся (новый IP) — после каждой пересборки backend нужно было
    # бы руками перезапускать nginx. Переменная заставляет резолвить заново
    # на каждый запрос (с кэшем по valid=10s, не чаще). Воспроизведено и
    # исправлено 2026-10-28: после пересборки backend nginx отдавал 502,
    # пока его не перезапустили руками.
    resolver 127.0.0.11 valid=10s;

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /search/ отдаёт SSE (text/event-stream) — буферизация nginx сломает
        # стриминг токенов клиенту (ответ придёт одним куском в конце, не
        # по мере генерации). Приложение уже шлёт X-Accel-Buffering: no
        # (см. routers/search.py), но proxy_buffering off нужен nginx'у
        # тоже — заголовок сам по себе не отключает буферизацию проксирования.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # LLM-генерация под очередью может занимать десятки секунд
    }
}
